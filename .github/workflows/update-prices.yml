name: 원물 시세 자동 업데이트

on:
  schedule:
    # 매일 22:30 UTC = 한국시간(KST) 07:30
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 국내 시세 수집 (KAMIS)
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        run: python scripts/fetch_kamis.py

      - name: 국제 원료 시세 수집 (Yahoo Finance)
        run: python scripts/fetch_intl.py

      - name: index.html 갱신
        run: python scripts/update_dashboard.py

      - name: 관심품목 급등/급락 이메일 알림
        env:
          SUBSCRIBE_SHEET_API_URL: ${{ secrets.SUBSCRIBE_SHEET_API_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python scripts/check_alerts_and_notify.py

      - name: 변경사항 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 원물 시세 자동 업데이트 $(date -u +%Y-%m-%d)"
            git push
          fi
