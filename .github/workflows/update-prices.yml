name: 원물 시세 자동 업데이트

on:
  schedule:
    # 매일 22:30 UTC = 한국시간(KST) 07:30
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 국내 시세 수집 (KAMIS)
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        run: python scripts/fetch_kamis.py

      - name: 국제 원료 시세 수집 (Yahoo Finance)
        run: python scripts/fetch_intl.py

      - name: 최근일자 도·소매가격 수집 (고춧가루 소매·건고추 도매)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_at_recent.py

      - name: index.html 갱신
        run: python scripts/update_dashboard.py

      - name: 뉴스 갱신 (원물 수매 이슈·가격인상 동향)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/update_news.py

      - name: 관심품목 급등/급락 이메일 알림
        env:
          SUBSCRIBE_SHEET_API_URL: ${{ secrets.SUBSCRIBE_SHEET_API_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
        run: python scripts/check_alerts_and_notify.py

      - name: 변경사항 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 원물 시세 자동 업데이트 $(date -u +%Y-%m-%d)"
            # 실행 도중 누군가 먼저 push 했어도 거절되지 않도록 원격 변경을 먼저 반영한다
            git pull --rebase origin main
            git push
          fi
